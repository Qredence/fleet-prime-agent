name: Fleet Prime CodeQL

# Activated for default setup by the github-codeql-config-file repository property.
# The engine directories are a verbatim upstream checkout pinned by UPSTREAM.
# Their findings are owned and remediated in PrimeIntellect-ai/prime-agent;
# Fleet-owned code remains covered by this repository's CodeQL workflow.
queries:
  - uses: security-extended

paths-ignore:
  - packages/ai/**
  - packages/agent/**
  - packages/tui/**
  - packages/coding-agent/**
  - prime-agent-runtime/**
