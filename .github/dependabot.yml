# Dependency update PRs wait out the same 7-day cooldown that
# pnpm-workspace.yaml's minimumReleaseAge (10080 minutes) enforces locally.
# Security-advisory PRs are exempt from cooldown by design, so CVE fixes
# still arrive promptly.
#
# The repository is a single pnpm workspace resolved through the root
# pnpm-lock.yaml; the root entry covers web/* and packages/fleet-web.
version: 2
# Allow Dependabot egress to the public Cloudflare R2 host that serves
# stock Prime Agent runtime tarballs (see packages/fleet-web/package.json).
# Without this, Dependabot rebases fail with egress-not-allowlisted.
registries:
  prime-agent-r2:
    type: npm-registry
    url: https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev
    # Placeholder Dependabot secret for public R2 (npm-registry requires a
    # token field; value is unused for public bucket).
    token: ${{secrets.DEPENDABOT_NULL_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - prime-agent-r2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@google/genai"
      - dependency-name: "esbuild"
      # Keep TypeScript on 6.x until compiler-API consumers migrate off
      # stable `import ts from "typescript"` (#225 closed; TS 7 moves API under typescript/unstable).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Match @types/node major to engines.node (>=22.12.0); do not jump to 26 (#227 closed).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
