# Dependency update PRs wait out the same 7-day cooldown that
# pnpm-workspace.yaml's minimumReleaseAge (10080 minutes) enforces locally.
# Security-advisory PRs are exempt from cooldown by design, so CVE fixes
# still arrive promptly.
#
# The repository is a single pnpm workspace resolved through the root
# pnpm-lock.yaml; the root entry covers web/* and packages/fleet-web.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Carried over from the vendored-engine era to keep update behavior
      # unchanged. Most of these dependencies no longer appear in the
      # unified lockfile; those entries are harmless no-ops.
      - dependency-name: "@anthropic-ai/sdk"
      - dependency-name: "@google/genai"
      - dependency-name: "@mistralai/mistralai"
      - dependency-name: "chalk"
      - dependency-name: "esbuild"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
