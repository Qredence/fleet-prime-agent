# Dependency update PRs wait out the same 7-day cooldown that
# pnpm-workspace.yaml's minimumReleaseAge (10080 minutes) enforces locally.
# Security-advisory PRs are exempt from cooldown by design, so CVE fixes
# still arrive promptly.
#
# The repository is a single pnpm workspace resolved through the root
# pnpm-lock.yaml; the root entry covers web/* and packages/fleet-web.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@google/genai"
      - dependency-name: "esbuild"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7