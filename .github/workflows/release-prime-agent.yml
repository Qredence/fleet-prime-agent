name: Release Prime Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version or tag, for example v0.7.2"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

concurrency:
  group: release-prime-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.context.outputs.build_ref }}
      channel: ${{ steps.context.outputs.channel }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_RELEASE_TAG#v}"
            channel="$INPUT_CHANNEL"
            build_ref="$GITHUB_SHA_VALUE"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            channel=stable
            build_ref="$REF_NAME"
          else
            echo "Releases must run from a v* tag or workflow_dispatch." >&2
            exit 1
          fi

          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          if [ "$channel" != stable ] && [ "$channel" != beta ]; then
            echo "Invalid release channel: $channel" >&2
            exit 1
          fi

          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      RELEASE_CHANNEL: ${{ needs.release-context.outputs.channel }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install npm dependencies
        run: npm ci

      - name: Install web dependencies
        run: pnpm install --dir web --frozen-lockfile

      - name: Build packages
        run: npm run build

      - name: Build packaged web runtime
        run: npm run build:web:release

      - name: Check
        run: npm run check

      - name: Pack release
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          npm run release:pack -- \
            --channel "$RELEASE_CHANNEL" \
            --version "$RELEASE_VERSION" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir "packages/coding-agent/release/$RELEASE_CHANNEL"

      - name: Smoke-test installed release
        run: |
          node scripts/check-web-release.mjs \
            --package-dir "packages/coding-agent/release/$RELEASE_CHANNEL/packages/coding-agent" \
            --artifacts-dir "packages/coding-agent/release/$RELEASE_CHANNEL/artifacts"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prime-agent-${{ env.RELEASE_CHANNEL }}
          path: packages/coding-agent/release/${{ env.RELEASE_CHANNEL }}/artifacts/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-context, build]
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CHANNEL: ${{ needs.release-context.outputs.channel }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.build_ref }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: prime-agent-${{ env.CHANNEL }}
          path: release-artifacts

      - name: Prepare installer
        run: |
          INSTALL_BASE_URL="${R2_PUBLIC_BASE_URL%/}"
          export INSTALL_BASE_URL
          test -n "$INSTALL_BASE_URL"

          node - <<'NODE'
          const fs = require("node:fs");
          const baseUrl = process.env.INSTALL_BASE_URL;
          const installer = fs.readFileSync("install.sh", "utf8");
          const renderInstaller = (channel) => installer
            .replaceAll("__PRIME_AGENT_DOWNLOAD_BASE_URL__", baseUrl)
            .replaceAll("__PRIME_AGENT_DEFAULT_RELEASE_CHANNEL__", channel);
          fs.writeFileSync("/tmp/prime-agent-install.sh", renderInstaller("stable"));
          fs.writeFileSync("/tmp/prime-agent-install-beta.sh", renderInstaller("beta"));
          NODE

      - name: Publish artifacts to Qredence R2
        run: |
          RELEASE_DIR=release-artifacts
          RELEASE_PREFIX="releases/v${RELEASE_VERSION}"
          test -f "$RELEASE_DIR/prime-agent-${RELEASE_VERSION}.tgz"
          test -f "$RELEASE_DIR/SHA256SUMS"
          test -f "$RELEASE_DIR/$CHANNEL"
          test -f "$RELEASE_DIR/${CHANNEL}.json" || test -f "$RELEASE_DIR/latest.json"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT_URL"

          for artifact in "$RELEASE_DIR"/*.tgz; do
            aws s3 cp "$artifact" "s3://${R2_BUCKET}/${RELEASE_PREFIX}/$(basename "$artifact")" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --content-type application/gzip \
              --cache-control 'public, max-age=31536000, immutable'
          done

          aws s3 cp "$RELEASE_DIR/SHA256SUMS" "s3://${R2_BUCKET}/${RELEASE_PREFIX}/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type text/plain \
            --cache-control 'public, max-age=31536000, immutable'

          if [ "$CHANNEL" = stable ]; then
            aws s3 cp "$RELEASE_DIR/latest.json" "s3://${R2_BUCKET}/latest.json" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --content-type application/json \
              --cache-control no-cache
          else
            aws s3 cp "$RELEASE_DIR/beta.json" "s3://${R2_BUCKET}/beta.json" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --content-type application/json \
              --cache-control no-cache
          fi

          aws s3 cp "$RELEASE_DIR/$CHANNEL" "s3://${R2_BUCKET}/$CHANNEL" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type text/plain \
            --cache-control no-cache

          if [ "$CHANNEL" = stable ]; then
            aws s3 cp /tmp/prime-agent-install.sh "s3://${R2_BUCKET}/install.sh" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --content-type text/x-shellscript \
              --cache-control no-cache
          else
            aws s3 cp /tmp/prime-agent-install-beta.sh "s3://${R2_BUCKET}/install-beta.sh" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --content-type text/x-shellscript \
              --cache-control no-cache
          fi

      - name: Create GitHub release for stable builds
        if: env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" release-artifacts/* --clobber
          else
            gh release create "v${RELEASE_VERSION}" \
              --title "v${RELEASE_VERSION}" \
              --generate-notes \
              release-artifacts/*
          fi
