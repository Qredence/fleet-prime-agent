packages:
  - app
  - design
  - protocol
  - server

# 7 days in minutes. Matches root npm min-release-age.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Upstream's signed runtime tarball declares its own pinned R2 package tarballs.
# Their hashes are verified by PRIME_AGENT_RUNTIME.json and the release smoke test.
blockExoticSubdeps: false
# Excluded: existing lockfile entries with a trust downgrade. @pierre/theme@2.0.0
# (via @pierre/diffs@1.3.4) and semver@6.3.1 have no provenance where earlier
# versions did. Revisit after upstream restores provenance or entries are bumped.
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - semver@6.3.1
confirmModulesPurge: false

allowBuilds:
  esbuild: true
  "@openuidev/lang-core": true
  '@google/genai': false
  koffi: false
  prime-agent@https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v0.8.1/prime-agent-0.8.1.tgz: true
  protobufjs: false
  zeromq: true

publicHoistPattern:
  - "*vite*"
  - "*@tanstack*"
  - "*tailwindcss*"

overrides:
  # Unify highlighter types: streamdown's published .d.ts imports `shiki`
  # while @streamdown/code pins 3.x and @pierre/diffs pins 4.x.
  shiki: 4.4.2
  # GHSA-2v37-7h3g-55p8: nanoid < 3.3.18 can loop indefinitely (via postcss).
  nanoid: ^3.3.18
