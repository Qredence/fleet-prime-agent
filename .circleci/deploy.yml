version: 2.1

executors:
  node-release-deploy:
    docker:
      - image: cimg/node:22.23.2
    resource_class: medium
    working_directory: ~/prime-agent

jobs:
  deploy-fleet:
    executor: node-release-deploy
    environment:
      COMPONENT_NAME: << pipeline.deploy.component_name >>
      ENVIRONMENT_NAME: << pipeline.deploy.environment_name >>
      DEPLOY_CURRENT_VERSION: << pipeline.deploy.current_version >>
      DEPLOY_TARGET_VERSION: << pipeline.deploy.target_version >>
    steps:
      - checkout
      - run:
          name: Configure scoped npm deployment credentials
          command: |
            set -euo pipefail
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "NPM_TOKEN is required for dist-tag promotion" >&2
              exit 1
            fi
            npmrc_path="$(mktemp)"
            chmod 600 "${npmrc_path}"
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${npmrc_path}"
            echo "export NPM_CONFIG_USERCONFIG=${npmrc_path}" >> "${BASH_ENV}"
      - run:
          name: Validate Fleet deployment target
          command: |
            set -euo pipefail
            if [ "${COMPONENT_NAME}" != "@qredence/fleet" ]; then
              echo "Unsupported deployment component: ${COMPONENT_NAME}" >&2
              exit 1
            fi
            if [ "${ENVIRONMENT_NAME}" != "production" ]; then
              echo "Unsupported deployment environment: ${ENVIRONMENT_NAME}" >&2
              exit 1
            fi
            if [ -z "${DEPLOY_CURRENT_VERSION}" ] || [ "${DEPLOY_CURRENT_VERSION}" = "<nil>" ]; then
              echo "Current deployed version is required" >&2
              exit 1
            fi
            if [ -z "${DEPLOY_TARGET_VERSION}" ] || [ "${DEPLOY_TARGET_VERSION}" = "<nil>" ]; then
              echo "Target deployment version is required" >&2
              exit 1
            fi
      - run:
          name: Plan Fleet deployment marker
          command: |
            set -euo pipefail
            circleci run release plan fleet-deploy \
              --environment-name="${ENVIRONMENT_NAME}" \
              --component-name="${COMPONENT_NAME}" \
              --target-version="${DEPLOY_TARGET_VERSION}"
      - run:
          name: Promote npm latest dist-tag
          command: node scripts/deploy-release.mjs
      - run:
          name: Mark Fleet deployment successful
          command: circleci run release update fleet-deploy --status=SUCCESS
          when: on_success
      - run:
          name: Mark Fleet deployment failed
          command: |
            circleci run release update fleet-deploy \
              --status=FAILED \
              --failure-reason="npm dist-tag promotion failed"
          when: on_fail

  cancel-deploy-marker:
    executor: node-release-deploy
    steps:
      - run:
          name: Mark canceled Fleet deployment
          command: circleci run release update fleet-deploy --status=CANCELED

  fleet-deploy-release:
    type: release
    plan_name: fleet-deploy

workflows:
  deploy:
    jobs:
      - deploy-fleet:
          context:
            - npm-dist-tag-deploy
          serial-group: fleet-release-operations
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - fleet-deploy-release:
          requires:
            - deploy-fleet
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - cancel-deploy-marker:
          requires:
            - deploy-fleet:
                - canceled
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
