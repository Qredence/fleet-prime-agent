version: 2.1

commands:
  install-pnpm:
    parameters:
      pnpm_version:
        type: string
        default: "11.15.1"
    steps:
      - run:
          name: Install pnpm
          command: |
            pnpm_root="${HOME}/.cache/fleet-pnpm"
            mkdir -p "${pnpm_root}"
            npm install --prefix "${pnpm_root}" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "pnpm@<< parameters.pnpm_version >>"
            pnpm_bin="${pnpm_root}/node_modules/pnpm/bin/pnpm.cjs"
            pnpm_bin_dir="${pnpm_root}/node_modules/.bin"
            if [ ! -f "${pnpm_bin}" ]; then
              echo "Expected pnpm launcher was not installed at ${pnpm_bin}" >&2
              exit 1
            fi
            if [ ! -x "${pnpm_bin_dir}/pnpm" ]; then
              echo "Expected pnpm executable was not installed at ${pnpm_bin_dir}/pnpm" >&2
              exit 1
            fi
            echo "export FLEET_PNPM_BIN=\"${pnpm_bin}\"" >> "${BASH_ENV}"
            echo "export PATH=\"${pnpm_bin_dir}:\$PATH\"" >> "${BASH_ENV}"
            echo 'export npm_config_manage_package_manager_versions=false' >> "${BASH_ENV}"
            echo 'pnpm() { node "${FLEET_PNPM_BIN}" "$@"; }' >> "${BASH_ENV}"
            export FLEET_PNPM_BIN="${pnpm_bin}"
            export PATH="${pnpm_bin_dir}:${PATH}"
            export npm_config_manage_package_manager_versions=false
            pnpm() { node "${FLEET_PNPM_BIN}" "$@"; }
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

executors:
  node-lts:
    docker:
      - image: cimg/node:22.23.2
    resource_class: medium
    working_directory: ~/prime-agent

jobs:
  release-publish:
    executor: node-lts
    environment:
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      NAMESPACE: "<< pipeline.deploy.namespace >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Pin npm trusted-publishing CLI
          command: sudo npm install --global npm@11.15.0
      - install-pnpm
      - run:
          name: Plan release
          command: |
            circleci run release plan \
              --environment-name=${ENVIRONMENT_NAME} \
              --namespace=${NAMESPACE} \
              --component-name=${COMPONENT_NAME} \
              --target-version=${TARGET_VERSION}
      - run:
          name: Publish the verified artifact and GitHub release
          command: |
            pnpm run release:publish
      - run:
          name: Update deployment status to failed
          command: circleci run release update --status=FAILED
          when: on_fail
      - store_artifacts:
          path: dist-release
          destination: dist-release/release
  cancel-release-publish:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update release-publish \
              --status=CANCELED
  release-publish-release:
    type: release
    plan_name: release-publish
    validation:
      enabled: true
      auto_rollback_on_failure: true


workflows:
  deploy:
    jobs:
      - release-publish:
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - release-publish-release:
          requires:
            - release-publish
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - cancel-release-publish:
          requires:
            - release-publish:
              - canceled