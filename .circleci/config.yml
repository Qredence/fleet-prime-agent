version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.2
    working_directory: ~/prime-agent

commands:
  install-system-dependencies:
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libcairo2-dev \
              libgif-dev \
              libjpeg-dev \
              libpango1.0-dev \
              librsvg2-dev \
              fd-find \
              ripgrep
            sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo npm install --global pnpm@11.15.1
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-node22-pnpm-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v1-node22-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/pnpm

jobs:
  build-check:
    executor: node
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - run:
          name: Build web bundle and release artifacts
          command: pnpm run build
      - run:
          name: Check
          command: pnpm run check

  test-web:
    executor: node
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - run:
          name: Build web bundle
          command: pnpm run build
      - run:
          name: Prepare test results
          command: mkdir -p test-results
      - run:
          name: Test web app
          command: >-
            pnpm --filter @prime-agent/web run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-app.xml"
      - run:
          name: Test web server
          command: >-
            pnpm --filter @prime-agent/web-server run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-server.xml"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/web

  ci-success:
    executor: node
    steps:
      - run:
          name: Confirm all CI jobs passed
          command: echo "All CircleCI validation jobs passed."

  release:
    executor: node
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - run:
          name: Resolve release version
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Invalid release version: ${VERSION}" >&2
              echo "Expected semver such as 0.5.0 or 0.5.0-beta.1." >&2
              exit 1
            fi
            echo "export RELEASE_VERSION=${VERSION}" >> "$BASH_ENV"
      - run:
          name: Build web release bundle
          command: pnpm run build
      - run:
          name: Run checks with runtime tarball verification
          command: pnpm run check
          environment:
            PRIME_RUNTIME_VERIFY_TARBALL: "1"
      - run:
          name: Stamp fleet package version
          command: pnpm --dir packages/fleet-prime version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
      - run:
          name: Pack release artifact
          command: |
            mkdir -p dist-release
            pnpm --dir packages/fleet-prime pack --pack-destination "$PWD/dist-release"
            test -f "dist-release/qredence-fleet-${RELEASE_VERSION}.tgz"
      - run:
          name: Smoke test packed artifact
          command: node scripts/check-web-release.mjs --package "dist-release/qredence-fleet-${RELEASE_VERSION}.tgz"
      - run:
          name: Upgrade npm for trusted publishing
          command: sudo npm install --global npm@latest
      - run:
          name: Publish to npm
          working_directory: packages/fleet-prime
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish --access public
      - run:
          name: Generate checksum
          command: |
            cd dist-release
            sha256sum "qredence-fleet-${RELEASE_VERSION}.tgz" > SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Publish GitHub release
          command: node scripts/publish-github-release.mjs
      - store_artifacts:
          path: dist-release
          destination: dist-release

workflows:
  ci:
    when:
      not:
        equal: [schedule, << pipeline.trigger.type >>]
    jobs:
      - build-check:
          filters:
            tags:
              ignore: /.*/
      - test-web:
          filters:
            tags:
              ignore: /.*/
      - ci-success:
          requires:
            - build-check
            - test-web
          filters:
            tags:
              ignore: /.*/

  release:
    jobs:
      - release:
          context:
            - github-release
          filters:
            tags:
              only: /^v[0-9].*/
            branches:
              ignore: /.*/
