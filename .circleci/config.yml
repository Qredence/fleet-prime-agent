version: 2.1

executors:
  node-lts:
    docker:
      - image: cimg/node:22.23.2
    working_directory: ~/prime-agent

  node-release-smoke:
    docker:
      - image: cimg/node:22.12.0
    working_directory: ~/prime-agent

  macos-release-smoke:
    macos:
      xcode: 26.6.0
    resource_class: m4pro.medium
    working_directory: ~/prime-agent

commands:
  install-system-dependencies:
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libcairo2-dev \
              libgif-dev \
              libjpeg-dev \
              libpango1.0-dev \
              librsvg2-dev \
              fd-find \
              ripgrep
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo npm install --global pnpm@11.15.1
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-dependencies:
    steps:
      - restore_cache:
          keys:
            - v2-linux-node22-pnpm-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile

  fetch-main:
    steps:
      - run:
          name: Fetch main for Changeset comparison
          command: git fetch --no-tags origin main:refs/remotes/origin/main

  install-node-22-12-macos:
    steps:
      - run:
          name: Install Node.js 22.12.0
          command: |
            set -euo pipefail
            node_dist="node-v22.12.0-darwin-arm64"
            node_archive="${node_dist}.tar.gz"
            node_url="https://nodejs.org/dist/v22.12.0"
            node_tmp="${TMPDIR:-/tmp}/fleet-node-22.12.0"
            mkdir -p "${node_tmp}" "${HOME}/.local"
            curl --fail --location "${node_url}/${node_archive}" --output "${node_tmp}/${node_archive}"
            curl --fail --location "${node_url}/SHASUMS256.txt" --output "${node_tmp}/SHASUMS256.txt"
            (cd "${node_tmp}" && grep " ${node_archive}$" SHASUMS256.txt | shasum -a 256 -c -)
            tar -xzf "${node_tmp}/${node_archive}" --directory "${HOME}/.local"
            echo "export PATH=\"${HOME}/.local/${node_dist}/bin:\$PATH\"" >> "${BASH_ENV}"
            export PATH="${HOME}/.local/${node_dist}/bin:${PATH}"
            node --version
            npm --version

  check-node-22-12:
    steps:
      - run:
          name: Verify Node.js 22.12.0 lane
          command: |
            node --version
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 22 || minor < 12) process.exit(1)'

jobs:
  build-check:
    executor: node-lts
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - run:
          name: Build web bundle and release artifacts
          command: pnpm run build:web:release
      - run:
          name: Check
          command: pnpm run check
      - fetch-main
      - run:
          name: Require a Changeset for user-facing package changes
          command: pnpm run check:changeset
      - run:
          name: Test release automation
          command: pnpm run test:release
      - save_cache:
          key: v2-linux-node22-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/pnpm
      - persist_to_workspace:
          root: .
          paths:
            - packages/fleet-prime/dist

  test-web:
    executor: node-lts
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - run:
          name: Build web bundle
          command: pnpm run build:web:release
      - run:
          name: Prepare test results
          command: mkdir -p test-results
      - run:
          name: Test web app
          command: >-
            pnpm --filter @prime-agent/web run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-app.xml"
      - run:
          name: Test web server
          command: >-
            pnpm --filter @prime-agent/web-server run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-server.xml"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/web

  package-verify-linux:
    executor: node-release-smoke
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-dependencies
      - attach_workspace:
          at: .
      - check-node-22-12
      - run:
          name: Verify packed npm artifact
          command: |
            mkdir -p dist-release
            node scripts/check-package.mjs --out-dir dist-release
      - store_artifacts:
          path: dist-release
          destination: dist-release/linux
      - persist_to_workspace:
          root: .
          paths:
            - dist-release

  package-verify-macos:
    executor: macos-release-smoke
    steps:
      - checkout
      - install-node-22-12-macos
      - attach_workspace:
          at: .
      - check-node-22-12
      - run:
          name: Install the exact packed artifact globally
          command: |
            VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("packages/fleet-prime/package.json", "utf8")).version')"
            node scripts/check-web-release.mjs --package "dist-release/qredence-fleet-${VERSION}.tgz"

  ci-success:
    executor: node-lts
    steps:
      - run:
          name: Confirm all CircleCI validation jobs passed
          command: echo "All CircleCI validation jobs passed."

  release-prepare:
    executor: node-lts
    steps:
      - checkout
      - install-pnpm
      - install-dependencies
      - run:
          name: Prepare or reuse the Changesets release pull request
          command: pnpm run release:prepare

  release-publish:
    executor: node-lts
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Pin npm trusted-publishing CLI
          command: sudo npm install --global npm@11.5.1
      - install-pnpm
      - run:
          name: Publish the verified artifact and GitHub release
          command: pnpm run release:publish
      - store_artifacts:
          path: dist-release
          destination: dist-release/release

workflows:
  ci:
    when:
      not:
        equal: [schedule, << pipeline.trigger.type >>]
    jobs:
      - build-check:
          filters:
            tags:
              ignore: /.*/
      - test-web:
          filters:
            tags:
              ignore: /.*/
      - package-verify-linux:
          requires:
            - build-check
          filters:
            tags:
              ignore: /.*/
      - package-verify-macos:
          requires:
            - package-verify-linux
          filters:
            tags:
              ignore: /.*/
      - ci-success:
          requires:
            - build-check
            - test-web
            - package-verify-linux
            - package-verify-macos
          filters:
            tags:
              ignore: /.*/
      - release-prepare:
          requires:
            - ci-success
          context:
            - release-automation
          serial-group: fleet-release-preparation
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - release-publish:
          requires:
            - ci-success
          context:
            - github-release
          serial-group: fleet-release-publication
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/

  nightly:
    triggers:
      - schedule:
          cron: "0 9 * * *"
          filters:
            branches:
              only: main
    jobs:
      - build-check:
          filters:
            tags:
              ignore: /.*/
      - test-web:
          filters:
            tags:
              ignore: /.*/
      - package-verify-linux:
          requires:
            - build-check
          filters:
            tags:
              ignore: /.*/
      - package-verify-macos:
          requires:
            - package-verify-linux
          filters:
            tags:
              ignore: /.*/
      - ci-success:
          requires:
            - build-check
            - test-web
            - package-verify-linux
            - package-verify-macos
          filters:
            tags:
              ignore: /.*/
