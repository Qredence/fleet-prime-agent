version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.2
    working_directory: ~/prime-agent

commands:
  install-system-dependencies:
    steps:
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libcairo2-dev \
              libgif-dev \
              libjpeg-dev \
              libpango1.0-dev \
              librsvg2-dev \
              fd-find \
              ripgrep
            if command -v fdfind >/dev/null 2>&1; then
              sudo tee /usr/local/bin/fd >/dev/null \<<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail

            base_dir="."
            args=("$@")
            for ((index = 0; index < ${#args[@]}; index += 1)); do
              case "${args[index]}" in
                --base-directory)
                  if ((index + 1 < ${#args[@]})); then
                    base_dir="${args[index + 1]}"
                  fi
                  ;;
                --base-directory=*)
                  base_dir="${args[index]#--base-directory=}"
                  ;;
              esac
            done

            output="$(fdfind --strip-cwd-prefix "$@")" || exit $?
            if [[ -z "$output" ]]; then
              exit 1
            fi

            while IFS= read -r path; do
              path="${path#./}"
              if [[ "$path" != */ && ( -d "$path" || -d "$base_dir/$path" ) ]]; then
                path="$path/"
              fi
              printf '%s\n' "$path"
            done \<<< "$output"
            EOF
              sudo chmod +x /usr/local/bin/fd
            elif ! command -v fd >/dev/null 2>&1; then
              echo "fd is not available after installing fd-find" >&2
              exit 1
            fi

  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo npm install --global pnpm@11.15.1
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-root-dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-node22-npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: v1-node22-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  install-web-dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-node22-pnpm-{{ checksum "web/pnpm-lock.yaml" }}
      - run:
          name: Install web dependencies
          command: pnpm install --dir web --frozen-lockfile
      - save_cache:
          key: v1-node22-pnpm-{{ checksum "web/pnpm-lock.yaml" }}
          paths:
            - ~/.cache/pnpm

jobs:
  build-check:
    executor: node
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-root-dependencies
      - install-web-dependencies
      - run:
          name: Build web bundle and release artifacts
          command: npm run build
      - run:
          name: Check
          command: npm run check

  test-web:
    executor: node
    steps:
      - checkout
      - install-system-dependencies
      - install-pnpm
      - install-root-dependencies
      - install-web-dependencies
      - run:
          name: Build web bundle
          command: npm run build
      - run:
          name: Prepare test results
          command: mkdir -p test-results
      - run:
          name: Test web app
          command: >-
            pnpm --dir web --filter @prime-agent/web run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-app.xml"
      - run:
          name: Test web server
          command: >-
            pnpm --dir web --filter @prime-agent/web-server run test
            --reporter=default --reporter=junit
            --outputFile="$PWD/test-results/web-server.xml"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/web

  ci-success:
    executor: node
    steps:
      - run:
          name: Confirm all CI jobs passed
          command: echo "All CircleCI validation jobs passed."

workflows:
  ci:
    when:
      not:
        equal: [schedule, << pipeline.trigger.type >>]
    jobs:
      - build-check
      - test-web
      - ci-success:
          requires:
            - build-check
            - test-web
