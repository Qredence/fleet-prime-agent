packages:
  - packages/fleet-web
  - web/app
  - web/protocol
  - web/server

# 7 days in minutes (was the root .npmrc min-release-age=7).
minimumReleaseAge: 10080
# User-directed OpenUI upgrade on 2026-11-07. Dashboards need @openuidev/server
# 0.4.0, which requires lang-core ^1.1.0, and @openuidev/dashboard-library has no
# release older than 7 days (package created 2026-11-03). Publish dates:
# lang-core 1.1.0 and react-lang 1.1.0 on 2026-11-04; server 0.4.0 and
# react-components 0.0.2 on 2026-11-05; react-ui 0.18.5, react-headless 0.18.5,
# and dashboard-library 0.0.2 on 2026-11-06. Exclusions name those releases.
# Do not lower the global age, and do not exclude the package names outright.
minimumReleaseAgeExclude:
  - '@openuidev/lang-core@1.1.0'
  - '@openuidev/react-lang@1.1.0'
  - '@openuidev/react-ui@0.18.5'
  - '@openuidev/react-headless@0.18.5'
  - '@openuidev/server@0.4.0'
  - '@openuidev/dashboard-library@0.0.2'
  - '@openuidev/react-components@0.0.2'
managePackageManagerVersions: false
trustPolicy: no-downgrade
# Upstream's signed runtime tarball declares its own pinned R2 package tarballs.
# Their hashes are verified by PRIME_AGENT_RUNTIME.json and the release smoke test.
blockExoticSubdeps: false
# Excluded: lockfile entries with a trust downgrade — published without
# provenance where earlier versions had it (@pierre/theme@2.0.0 via
# @pierre/diffs@1.3.4, the npm re-published semver 5.7.2/6.3.1 releases,
# undici-types@6.21.0 via the root @types/node toolchain). Revisit after
# upstream restores provenance or entries are bumped.
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - semver@6.3.1
  - semver@5.7.2
  - undici-types@6.21.0
confirmModulesPurge: false

allowBuilds:
  esbuild: true
  "@openuidev/lang-core": true
  '@google/genai': false
  koffi: false
  protobufjs: false
  prime-agent@https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v0.9.8/prime-agent-0.9.8.tgz: true
  zeromq: true
  # Root toolchain packages that gained install scripts under the unified workspace.
  "@typescript/native-preview": true
  better-sqlite3: true

publicHoistPattern:
  - "*vite*"
  - "*@tanstack*"
  - "*tailwindcss*"

overrides:
  # One OpenUI Lang runtime. dashboard-library's range also accepts 1.0.2.
  "@openuidev/lang-core": 1.1.0
  "@openuidev/react-lang": 1.1.0
  # Security pins previously enforced as npm overrides at the repo root.
  rimraf: 6.1.2
  gaxios>rimraf: 6.1.2
  # Dependabot critical (#265): shell-quote < 1.11.0 (via launch-editor / @changesets/cli).
  shell-quote: 1.11.0
  # Unify highlighter types across streamdown, @streamdown/code, and @pierre/diffs.
  shiki: 4.5.0
  # GHSA-2v37-7h3g-55p8: nanoid < 3.3.18 can loop indefinitely (via postcss).
  nanoid: ^3.3.18
  # Dependabot high (#213): brace-expansion < 5.0.11 (GHSA via alerts 32/33).
  brace-expansion: 5.0.12
  # Dependabot high: undici 7.x < 7.30.1 (alerts 94/93/92/87; GHSA-4w7w-5xrc-9h26 and related).
  # Pin exact 7.30.1: 7.30.2 is still inside minimumReleaseAge.
  undici: 7.30.1
  # Dependabot high (#213 / GHSA-c475-qrg2-pj4r): basic-ftp <= 6.2.0 (alert 39).
  # get-uri still declares ^5.x; 6.2.1 is the first patched release and clears the
  # 7-day minimumReleaseAge window (6.2.2 published 2026-10-04 is still too young).
  basic-ftp: 6.2.1
  # Dependabot high (#213): fast-uri < 3.1.7 (alerts 10–13 / 22; first patched 3.1.7).
  # Via ajv@8.20.0. Raised to 3.1.9 (first patched for the newer alert; past the 7-day window).
  fast-uri: 3.1.9
  # Dependabot high (#213 / GHSA-2883-xcg3-v3hh): js-yaml < 4.3.2 (alert 18).
  # Via cosmiconfig / xmlbuilder2.
  js-yaml: 4.3.2
  # Dependabot medium (#213): hono < 4.13.7 (alerts 15/17 first patched 4.13.5; alert 38 first patched 4.13.7).
  # Via @modelcontextprotocol/sdk / @hono/node-server. Superseded below (#265).
  # Dependabot medium (#265 / alert 67): hono < 4.13.11. 4.13.13 is past the 7-day window.
  hono: 4.13.13
  # Dependabot medium (#213): ip-address <= 10.7.0 (alerts 20/21 first patched 10.5.1; alert 36 first patched 10.7.1).
  # Via express-rate-limit and socks. Pin 10.7.2 (latest mature; 10.7.3 published 2026-10-01 is still too young).
  ip-address: 10.7.2
  # cytoscape 3.34.1 published without provenance where 3.34.0 had it
  # (trust downgrade); keep the attested version until it is restored.
  cytoscape: 3.34.0
  # rolldown 1.2.5 (vite 8's bundler) re-chunks the client graph: the app
  # shell merges into one eager chunk and the eager graph grows 24%,
  # tripping check:bundle. Keep 1.2.4 until upstream chunking settles.
  rolldown: 1.2.4
  # Dependabot (#265): transitive fixes Dependabot cannot apply on its own.
  # All targets clear the 7-day minimumReleaseAge window.
  # critical: proxy-addr < 2.0.8 (via express / @modelcontextprotocol/sdk).
  proxy-addr: 2.0.8
  # high (alerts 68/69/70): @modelcontextprotocol/sdk < 1.32.0 (via @google/genai, @openuidev/lang-core).
  "@modelcontextprotocol/sdk": 1.32.1
  # high: source-map-js < 1.2.2 (via postcss / @tailwindcss/node).
  source-map-js: 1.2.2
  # postcss-selector-parser 7.x < 7.1.6 (via shadcn; 7.1.7 is still too young).
  postcss-selector-parser@7: 7.1.6
  # In-range transitive security fixes that `pnpm up --depth Infinity` would not
  # apply on its own (parents pinned via overrides / already-installed preference).
  # All targets clear the 7-day minimumReleaseAge window and keep trust evidence.
  # seroval high (GHSA-97r2/wp97/7rv5, <= 1.6.7) + mediums (< 1.6.11), via
  # @tanstack/router-core (^1.6.7). 1.7.2 was published without provenance after
  # attested 1.7.0/1.7.1 (trustPolicy no-downgrade rejects it) and 1.7.3+ is
  # still too young, so pin the attested 1.7.1.
  seroval: 1.7.1
  seroval-plugins: 1.7.1
  # qs medium (GHSA-6pq8 / GHSA-x5fp / GHSA-4mjr, <= 6.16.0), via express /
  # body-parser (^6.14.0). 6.17.1 is still too young.
  qs: 6.17.0
  # @hono/node-server medium (GHSA-rmxm-3fg6-px4f, < 2.1.3), via
  # @modelcontextprotocol/sdk (^1.19.9 || ^2.0.5). 2.1.6 is still too young.
  "@hono/node-server": 2.1.5
  # Dependabot low (alert #60 / GHSA-238p-pmpm-9mq7): katex < 0.18.2 prototype
  # pollution can bypass trust restrictions. Via @openuidev/react-ui ->
  # rehype-katex@7 / remark-math (declare katex ^0.16.0, so no in-range fix).
  # 0.18.10 is past the 7-day minimumReleaseAge window; 0.18.11 is deprecated
  # upstream (strict-mode breaking change, re-released as 0.19.0).
  katex: 0.18.10
